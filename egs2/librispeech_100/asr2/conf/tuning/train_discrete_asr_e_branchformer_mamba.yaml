# src_tokenizer_encode_conf:
#     enable_sampling: true    # If set to true, bpe-dropout is used.
#     alpha: 0.4
#     nbest_size: -1

frontend: embed     # embedding + positional encoding
frontend_conf:
    embed_dim: 512
    positional_dropout_rate: 0.1

specaug: specaug
specaug_conf:
    apply_time_warp: false
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: false
    freq_mask_width_range:
    - 0
    - 10
    num_freq_mask: 0
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 10

encoder: e_branchformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 1024
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv1d2
    layer_drop_rate: 0.0
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31

decoder: mamba
decoder_conf:
    input_layer: embed
    ssm_cfg:
        d_state: 16
        d_conv: 4
        expand: 4
        dt_rank: auto
        dt_min: 0.001
        dt_max: 0.1
        dt_init: random
        dt_scale: 1.0
        dt_init_floor: 0.0001
        conv_bias: true
        bias: false
        use_fast_path: true
        dropout_type: dropout1d
        projection_dropout_rate: 0.2
    norm_epsilon: 1.0e-5
    rms_norm: false
    fused_add_norm: false
    residual_in_fp32: true
    num_blocks: 6
    dropout: 0.2
    emb_dropout: 0.2
    init_rescale: true
    cross_attn_cfg:
        n_head: 4
        dropout_rate: 0.2

model: discrete_asr
model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false
    share_decoder_input_output_embed: false
    share_encoder_decoder_input_embed: false

use_amp: true
num_att_plot: 1
log_interval: 1000
num_workers: 4
batch_type: numel
batch_bins: 280000000
accum_grad: 2
max_epoch: 70
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 10

optim: adamw
optim_conf:
    lr: 0.006
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000
exclude_weight_decay: true